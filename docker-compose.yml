services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ruwi
      POSTGRES_USER: ruwi
      POSTGRES_PASSWORD: ruwi
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/initialization:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruwi -d ruwi"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ruwi:ruwi@db:5432/ruwi
      LOCAL_STORAGE_DIR: /app/storage
    volumes:
      - uploads_data:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  uploads_data:
